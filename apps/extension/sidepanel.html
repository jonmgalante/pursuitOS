<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Rep Copilot</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="./pursuit-theme.css" />
    <style>
      body {
        padding: var(--space-4);
      }

      .card {
        margin-bottom: var(--space-4);
      }

      h1,
      h2 {
        margin-top: 0;
      }

      input {
        margin-bottom: var(--space-3);
      }

      .button-row {
        margin-top: var(--space-4);
      }

      button:disabled {
        cursor: progress;
      }

      .status {
        white-space: pre-wrap;
        margin-top: var(--space-4);
        padding: var(--space-4);
        border: var(--border-width) solid var(--subtle-border);
        border-radius: var(--radius-md);
        background: var(--raised-surface);
      }

      .status[data-state="loading"] {
        border-color: var(--insight-border);
        background: var(--insight-surface);
        color: var(--secondary-insight-foreground);
      }

      .status[data-state="success"] {
        border-color: var(--status-success-border);
        background: var(--status-success-surface);
        color: var(--primary-text);
      }

      .status[data-state="error"] {
        border-color: var(--status-missed-border);
        background: var(--status-missed-surface);
        color: var(--primary-text);
      }

      .summary {
        white-space: pre-wrap;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Rep Copilot</h1>
      <p class="muted">Capture visible Grip records from the active tab into the workspace.</p>
    </div>

    <div class="card">
      <h2>Workspace settings</h2>
      <label for="webAppUrl">Web app URL</label>
      <input id="webAppUrl" type="text" value="http://localhost:3000" />

      <label for="workspaceId">Workspace ID</label>
      <input id="workspaceId" type="text" value="ws_demo_summit_2026" />

      <div class="button-row">
        <button id="saveSettings" class="secondary">Save settings</button>
        <button id="openWorkspace" class="secondary">Open workspace</button>
      </div>
    </div>

    <div class="card">
      <h2>Capture</h2>
      <p class="muted">
        Open a visible attendee or session page and press capture. The extension injects the
        content script only into the active tab.
      </p>
      <div class="button-row">
        <button id="capture">Capture current page</button>
      </div>
      <div id="status" class="status" data-state="idle">Ready.</div>
    </div>

    <div id="lastCaptureCard" class="card" hidden>
      <h2>Last Capture</h2>
      <div id="lastCaptureSummary" class="summary muted"></div>
    </div>

    <script type="module" src="./sidepanel.js"></script>
  </body>
</html>
